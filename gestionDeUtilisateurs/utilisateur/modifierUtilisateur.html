<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
</head>
<div class="container">
    <body>
        <center>
            <h1 class="inscription">Modifier un Utilisateur</h1>
            <form action="">
                <table>
                    <tr>
                        <td><label for="nom">Nom:</label></td>
                        <td><input type="text" id="nom" name="nom" required></td>
                    </tr>
                    <tr>
                        <td><label for="prenom">Prénom:</label></td>
                        <td><input type="text" id="prenom" name="prenom" required></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input type="email" id="email" name="email" required></td>
                    </tr>
                    <tr>
                        <td><label for="fonction">Fonction:</label></td>
                        <td><input type="text" id="fonction" name="fonction" required></td>
                    </tr>
                    <tr>
                        <td><label for="telephone">Téléphone:</label></td>
                        <td><input type="tel" id="telephone" name="telephone" required></td>
                    </tr>
                    <tr>
                        <td><label for="direction">Direction:</label></td>
                        <td><select name="direction" id="direction" required>
                            <option value="">--------Sélectionner une direction--------</option>
                            <option value="">Direction Informatique</option>
                            <option value="">Direction des Ressources Humaines</option>
                            <option value="">Direction Financière</option>
                            <option value="">Direction Commerciale</option>
                        </select></td>
                    </tr>
                    <tr>
                        <td><label for="password"> Mot de passe:</label></td>
                    </tr>
                </table>
                <button type="submit"><a href="/gestionDeUtilisateurs/connexion.html">Sauvegarder les modifications</a></button>
            </form>

        </center>
        
    </body>

</div>
</html>
