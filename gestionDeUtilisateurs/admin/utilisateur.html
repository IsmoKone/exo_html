<!DOCTYPE html>

<head>

    <title>Page utilisateurs</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        padding: 20px;
    }
    
    div {
        background-color: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    search {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    input[type="text"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    #modifier {
        background-color: green;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    .bouton_recherche {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;

    }
    .bouton_recherche:hover {
       modifier {
        background-color: #007bff ;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
}

    #supprimer {
        background-color: red;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    #details {
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    button {
        padding: 10px 15px;
        /* background-color: #007bff; */
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    
    button:hover {
        background-color: #0056b3;
    }
    
    button a {
        text-decoration: none;
        color: white;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    
    caption {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
        text-align: left;
    }
    
    th {
        background-color: #007bff;
        color: white;
        padding: 12px;
        text-align: left;
        font-weight: bold;
    }
    
    td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
    }
    
    tbody tr:hover {
        background-color: #f9f9f9;
    }
</style>
